name: Facebook AI Publisher

on:
  schedule:
    # تشغيل 4 مرات يوميًا
    # 04:00 - 10:00 - 16:00 - 22:00 UTC
    - cron: "0 4,10,16,22 * * *"

  # تشغيل يدوي من GitHub Actions
  workflow_dispatch:

jobs:
  publish:
    name: Generate and Publish Facebook Post
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل ملفات المشروع
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. تشغيل Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ==========================================
      # 3. تثبيت المكتبات المطلوبة
      # لا نستخدم npm install بدون package.json
      # ==========================================
      - name: Install dependencies
        run: |
          npm install axios dotenv

      # ==========================================
      # 4. توليد ونشر المنشور على Facebook
      # ==========================================
      - name: Generate and Publish Facebook Post
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          node index.js

      # ==========================================
      # 5. حفظ نتيجة التشغيل
      # ==========================================
      - name: Save execution log
        if: always()
        run: |
          echo "================================"
          echo "Facebook AI Publisher Finished"
          echo "================================"
          echo "Date: $(date)"
          echo "Status: ${{ job.status }}"
