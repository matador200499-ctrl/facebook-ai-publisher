name: Facebook Video Publisher
on:
  schedule:
    - cron: '0 9,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate video and publish
        run: python3 index.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      - name: Commit and push history.json
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.json
          git commit -m "Update publication history [skip ci]" || echo "No changes to commit"
          git push
          
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output/video.mp4
          retention-days: 7

      - name: Send Email on Success
        if: success() && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🎉 نجاح تشغيل ونشر فيديو فيسبوك"
          body: "تم توليد ونشر الفيديو بنجاح على صفحة فيسبوك الخاصة بك اليوم."
          to: ${{ secrets.MAIL_USERNAME }}
          from: Facebook AI Publisher

      - name: Send Email on Failure
        if: failure() && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ تنبيه: فشل تشغيل نشر فيديو فيسبوك"
          body: "حدث خطأ أثناء محاولة توليد أو نشر الفيديو على فيسبوك. يرجى مراجعة سجلات GitHub Actions."
          to: ${{ secrets.MAIL_USERNAME }}
          from: Facebook AI Publisher

      - name: Send Weekly Report on Sunday
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && env.MAIL_USERNAME != ''
        run: |
          python3 weeklyReport.py
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
