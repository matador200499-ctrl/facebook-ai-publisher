name: Facebook AI Publisher

on:
  schedule:
    # 4 مرات يوميًا بتوقيت UTC
    # 10:00 صباحًا بتوقيت مصر = 08:00 UTC
    # 02:00 ظهرًا بتوقيت مصر = 12:00 UTC
    # 06:00 مساءً بتوقيت مصر = 16:00 UTC
    # 10:00 مساءً بتوقيت مصر = 20:00 UTC
    - cron: "0 8,12,16,20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Generate and Publish Facebook Post
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install axios dotenv

      - name: Generate and Publish Facebook Post
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node index.js

      - name: Save changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contentSeries.js

          git diff --cached --quiet || git commit -m "Update Facebook content rotation"

          git push
