name: Facebook AI Publisher

on:
  schedule:
    # 4 مرات يوميًا بتوقيت مصر تقريبًا
    # GitHub Actions يستخدم UTC
    - cron: "0 5,9,13,17 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Generate and Publish Facebook Post
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. تثبيت dotenv فقط
      # لأن المشروع الحالي لا يحتوي package.json
      - name: Install dependencies
        run: npm install dotenv

      # 4. تشغيل البرنامج
      - name: Generate and Publish Facebook Post
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node index.js

      # 5. حفظ تحديثات المواضيع
      - name: Commit topic updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contentSeries.js topics.txt used_topics.txt 2>/dev/null || true

          git diff --cached --quiet || git commit -m "Update content series after scheduled post"

          git push origin main || true
